services:
  postgres:
    image: postgres:18-alpine
    container_name: memoria-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DBNAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - memoria_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_DBNAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  memoria_postgres_dev: