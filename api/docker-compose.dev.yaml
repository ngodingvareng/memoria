services:
  postgres:
    image: postgres:18-alpine
    container_name: memoria-postgres-dev
    restart: no
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DBNAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    command:
      [
        "postgres",
        "-c",
        "max_connections=100",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "synchronous_commit=off",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_DBNAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    container_name: memoria-rustfs-dev
    restart: no
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Dev-only credentials — change these (and set via env vars, not
      # committed here) before this ever runs anywhere but localhost.
      - RUSTFS_ACCESS_KEY=${STORAGE_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${STORAGE_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
    driver: local
  rustfs_data:
    driver: local
