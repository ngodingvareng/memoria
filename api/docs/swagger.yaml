basePath: /api/v1
definitions:
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateThreadRequest:
    properties:
      color_hex:
        example: '#FF5733'
        type: string
      confirmation_timeout_minutes:
        example: 1440
        type: integer
      description:
        example: Push-ups and a run every weekday morning
        maxLength: 2000
        type: string
      has_commitment:
        example: true
        type: boolean
      name:
        example: Morning workout
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginRequest:
    properties:
      email:
        example: budi@example.com
        type: string
      password:
        example: correct horse battery staple
        type: string
    required:
    - email
    - password
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginResponse:
    properties:
      access_token:
        description: |-
          AccessToken is meant to be held in memory on the frontend (not
          localStorage) and sent via the Authorization: Bearer header.
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        description: |-
          ExpiresIn is in seconds, so the frontend can schedule a silent
          refresh shortly before the access token actually expires.
        example: 900
        type: integer
      user:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UserResponse'
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 42
        type: integer
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.RegisterRequest:
    properties:
      email:
        example: budi@example.com
        maxLength: 255
        type: string
      name:
        example: Budi Santoso
        maxLength: 255
        minLength: 1
        type: string
      password:
        description: |-
          scrypt hashes the whole password with no truncation. max=256 is
          just a generous sane upper bound (prevents someone posting a
          multi-KB "password" that'd waste CPU/memory on the scrypt KDF
          for no real security benefit).
        example: correct horse battery staple
        maxLength: 256
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.SearchThreadsResponse:
    properties:
      pagination:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse'
      threads:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadImageResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      url:
        example: https://storage.example.com/threads/.../abc123.jpg?X-Amz-...
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadResponse:
    properties:
      color_hex:
        type: string
      confirmation_timeout_minutes:
        type: integer
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      description:
        type: string
      has_commitment:
        type: boolean
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      name:
        example: Morning workout
        type: string
      updated_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UpdateThreadRequest:
    properties:
      color_hex:
        example: '#FF5733'
        type: string
      confirmation_timeout_minutes:
        example: 1440
        type: integer
      description:
        example: Push-ups and a run every weekday morning
        maxLength: 2000
        type: string
      name:
        example: Morning workout
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UserResponse:
    properties:
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      email:
        example: budi@example.com
        type: string
      email_verified:
        example: false
        type: boolean
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      name:
        example: Budi Santoso
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      errors: {}
      message:
        example: Success
        type: string
    type: object
  ? github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-array_github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadImageResponse
  : properties:
      code:
        example: 200
        type: integer
      data:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadImageResponse'
        type: array
      errors: {}
      message:
        example: Success
        type: string
    type: object
  ? github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse
  : properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginResponse'
      errors: {}
      message:
        example: Success
        type: string
    type: object
  ? github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_SearchThreadsResponse
  : properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.SearchThreadsResponse'
      errors: {}
      message:
        example: Success
        type: string
    type: object
  ? github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadImageResponse
  : properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadImageResponse'
      errors: {}
      message:
        example: Success
        type: string
    type: object
  ? github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadResponse
  : properties:
