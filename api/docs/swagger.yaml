info:
  contact: {}
  title: Book API
  version: "1.0"
paths:
  /activities:
    get:
      description: Search and filter the authenticated user's activities, with pagination
      parameters:
      - description: Filter by name (partial, case-insensitive)
        in: query
        name: name
        type: string
      - description: Filter by fixed-schedule flag
        in: query
        name: is_fixed_schedule
        type: boolean
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_SearchActivitiesResponse'
      summary: Search / list activities
      tags:
      - activities
    post:
      consumes:
      - application/json
      description: Create a new activity for the authenticated user
      parameters:
      - description: Create activity request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ActivityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Create a new activity
      tags:
      - activities
  /activities/{id}:
    delete:
      description: Soft-deletes an activity owned by the authenticated user
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Delete an activity
      tags:
      - activities
    get:
      description: Get a single activity belonging to the authenticated user
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ActivityResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Get an activity by ID
      tags:
      - activities
    put:
      consumes:
      - application/json
      description: Full-representation update of an activity owned by the authenticated
        user
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      - description: Update activity request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UpdateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ActivityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Update an activity
      tags:
      - activities
  /activities/{id}/images:
    get:
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-array_github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ActivityImageResponse'
      summary: List images for an activity
      tags:
      - activities
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ActivityImageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Upload an image for an activity
      tags:
      - activities
  /activities/{id}/images/{imageId}:
    delete:
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      - description: Image ID
        in: path
        name: imageId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete an activity image
      tags:
      - activities
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Returns an access token in the response body and sets
        the refresh token as an httpOnly cookie scoped to /auth.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out of the current session
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Reads the refresh token from the httpOnly cookie, rotates
        it, and returns a new access token plus a new refresh
        cookie. Reusing an already-rotated refresh token revokes
        its entire token family and forces a fresh login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Exchange the refresh token cookie for a new access/refresh token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Register a new account
      tags:
      - auth
swagger: "2.0"
