info:
  contact: {}
  title: Book API
  version: "1.0"
paths:
  /album:
    get:
      description: Every photo attachment from every Moment the authenticated user
        owns, newest occurrence first (FEATURES.md, Looking Back)
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Images per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ListAlbumResponse'
      summary: List the personal Album
      tags:
      - album
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always responds the same way whether or not email belongs to an
        account, so this can never be used to check which emails are registered.
      operationId: ForgotPassword
      parameters:
      - description: Email to send the reset link to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Request a password reset link
      tags:
      - auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a Google Identity Services ID token server-side
        and either logs into the account already linked to it,
        or creates a new one. If the token's email already
        belongs to a different, non-Google account, this returns
        409 rather than silently linking — the user should log
        in with their existing method instead.
      operationId: GoogleLogin
      parameters:
      - description: Google ID token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Log in (or sign up) with a Google ID token
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Returns an access token in the response body and sets
        the refresh token as an httpOnly cookie scoped to /auth.
      operationId: Login
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      operationId: Logout
      responses:
        "204":
          description: No Content
      summary: Log out of the current session
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Reads the refresh token from the httpOnly cookie, rotates
        it, and returns a new access token plus a new refresh
        cookie. Reusing an already-rotated refresh token revokes
        its entire token family and forces a fresh login.
      operationId: RefreshToken
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Exchange the refresh token cookie for a new access/refresh token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates the account (without a username — see
        PATCH /users/me/username for claiming one afterward) and
        immediately starts a session, exactly like /auth/login:
        returns an access token and sets the refresh token as an
        httpOnly cookie scoped to /auth.
      operationId: Register
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Register a new account
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Also revokes every existing session for the account, so a stolen
        session stops working the moment the password changes.
      operationId: ResetPassword
      parameters:
      - description: Email, reset token, and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Reset a password using the emailed token
      tags:
      - auth
  /circle-invites:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ListCircleInvitesResponse'
      summary: List my pending circle invites
      tags:
      - circle-invites
  /circle-invites/{id}/accept:
    post:
      parameters:
      - description: Invite ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleMemberResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Accept a circle invite
      tags:
      - circle-invites
  /circle-invites/{id}/decline:
    post:
      parameters:
      - description: Invite ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleInviteResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Decline a circle invite
      tags:
      - circle-invites
  /circle-join-requests:
    post:
      consumes:
      - application/json
      description: Joins immediately if the link doesn't require approval, otherwise
        opens a join request
      parameters:
      - description: Invite link token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.FollowInviteLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_FollowInviteLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Follow a circle invite link
      tags:
      - circle-join-requests
  /circle-join-requests/{id}/cancel:
    post:
      parameters:
      - description: Join request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleJoinRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Cancel my own circle join request
      tags:
      - circle-join-requests
  /circles:
    get:
      description: Every Circle the authenticated user is currently an active member
        of
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ListCirclesResponse'
      summary: List my circles
      tags:
      - circles
    post:
      consumes:
      - application/json
      description: Create a new private Circle; the caller becomes its admin
      parameters:
      - description: Create circle request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateCircleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Create a circle
      tags:
      - circles
  /circles/{id}:
    delete:
      description: Soft-deletes a Circle; admin-only
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Dissolve a circle
      tags:
      - circles
    get:
      description: Get a single Circle; requires the caller to be an active member
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Get a circle by ID
      tags:
      - circles
    put:
      consumes:
      - application/json
      description: Full-representation update of a Circle; admin-only
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      - description: Update circle request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UpdateCircleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Update a circle
      tags:
      - circles
  /circles/{id}/album:
    get:
      description: Every photo attachment from every Moment visible in the Circle
        — its own collaborative Threads plus Moments shared into it — newest occurrence
        first, with "from @username" attribution on shared-in images (FEATURES.md,
        Looking Back)
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Images per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ListAlbumResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: List a circle's Album
      tags:
      - album
  /circles/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Replaces any existing photo; admin-only. Publicly readable by URL,
        no signing.
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Upload a circle's profile photo
      tags:
      - circles
  /circles/{id}/invite-link:
    get:
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleInviteResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Get a circle's active invite link
      tags:
      - circle-invites
    post:
      consumes:
      - application/json
      description: The old link (if any) stops working the moment the new one exists;
        the raw token is only ever returned here
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      - description: Link options
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateOrRotateInviteLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleInviteLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Create or rotate a circle's invite link
      tags:
      - circle-invites
  /circles/{id}/invite-link/approval:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Circle ID
        in: path
        name: id
        required: true
        type: string
      - description: New approval requirement
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.SetInviteLinkRequiresApprovalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_CircleInviteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Toggle whether a circle's invite link requires approval
      tags:
      - circle-invites
