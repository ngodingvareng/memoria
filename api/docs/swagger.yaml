info:
  contact: {}
  title: Book API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Returns an access token in the response body and sets
        the refresh token as an httpOnly cookie scoped to /auth.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out of the current session
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Reads the refresh token from the httpOnly cookie, rotates
        it, and returns a new access token plus a new refresh
        cookie. Reusing an already-rotated refresh token revokes
        its entire token family and forces a fresh login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Exchange the refresh token cookie for a new access/refresh token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Register a new account
      tags:
      - auth
  /moments:
    get:
      description: The authenticated user's personal archive timeline, newest occurrence
        first
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Moments per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ListMomentsResponse'
      summary: List moments
      tags:
      - moments
    post:
      consumes:
      - application/json
      description: Create a new manually-captured Moment for the authenticated user
      parameters:
      - description: Create moment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateMomentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_MomentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Capture a new moment
      tags:
      - moments
  /moments/{id}:
    delete:
      description: Soft-deletes a Moment owned by the authenticated user
      parameters:
      - description: Moment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Delete a moment
      tags:
      - moments
    get:
      description: Get a single Moment belonging to the authenticated user
      parameters:
      - description: Moment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_MomentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Get a moment by ID
      tags:
      - moments
    put:
      consumes:
      - application/json
      description: Full-representation update of a Moment owned by the authenticated
        user
      parameters:
      - description: Moment ID
        in: path
        name: id
        required: true
        type: string
      - description: Update moment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UpdateMomentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_MomentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Update a moment
      tags:
      - moments
  /moments/{id}/images:
    get:
      parameters:
      - description: Moment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-array_github_com_ngodingvareng_memoria_internal_delivery_rest_dto_MomentImageResponse'
      summary: List images for a moment
      tags:
      - moments
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Moment ID
        in: path
        name: id
        required: true
        type: string
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_MomentImageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Upload an image for a moment
      tags:
      - moments
  /moments/{id}/images/{imageId}:
    delete:
      parameters:
      - description: Moment ID
        in: path
        name: id
        required: true
        type: string
      - description: Image ID
        in: path
        name: imageId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a moment image
      tags:
      - moments
  /moments/search:
    get:
      description: Global text Search over the authenticated user's own Moments
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Moments per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ListMomentsResponse'
        "400":
