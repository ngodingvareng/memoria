  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.RegisterRequest:
    properties:
      email:
        description: |-
          Username is deliberately not collected here — the account is
          created without one, and the welcome/onboarding step claims it
          afterward via PATCH /users/me/username.
        example: budi@example.com
        maxLength: 255
        type: string
      name:
        example: Budi Santoso
        maxLength: 255
        minLength: 1
        type: string
      password:
        description: |-
          scrypt hashes the whole password with no truncation. max=256 is
          just a generous sane upper bound (prevents someone posting a
          multi-KB "password" that'd waste CPU/memory on the scrypt KDF
          for no real security benefit).
        example: correct horse battery staple
        maxLength: 256
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ResetPasswordRequest:
    properties:
      email:
        example: budi@example.com
        maxLength: 255
        type: string
      new_password:
        example: a new correct horse battery staple
        maxLength: 256
        minLength: 8
        type: string
      token:
        description: |-
          Token is the raw value from the emailed reset link, never the
          hash stored server-side.
        example: 9f1c2e...
        type: string
    required:
    - email
    - new_password
    - token
    type: object
