basePath: /api/v1
definitions:
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateMomentRequest:
    properties:
      client_id:
        description: |-
          ClientID lets an offline-captured Moment be synced twice (e.g. a
          flaky retry) without creating a duplicate.
        type: string
      color_hex:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      note:
        maxLength: 10000
        type: string
      occurred_at:
        example: "2026-08-04T14:30:00+09:00"
        type: string
      occurred_utc_offset_minutes:
        description: |-
          The local UTC offset in effect where it happened, in minutes.
          Omitted means UTC (0) — see the moments.occurred_utc_offset_minutes
          column comment for the ±1020 (±17h) bound.
        example: 540
        maximum: 1020
        minimum: -1020
        type: integer
      origin:
        description: |-
          Origin defaults to "manual" server-side when omitted. "commitment"
          is deliberately not accepted here — Commitment-generated Moments
          never go through this path (FEATURES.md).
        enum:
        - manual
        - import
        type: string
      place_name:
        maxLength: 255
        type: string
      recorded_at:
        description: |-
          RecordedAt is for offline sync only: the true local time the user
          actually wrote the Moment down. Omitted means "now" (ordinary
          online capture) — see FEATURES.md's Time table.
        type: string
      thread_id:
        type: string
    required:
    - occurred_at
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateThreadRequest:
    properties:
      color_hex:
        example: '#FF5733'
        type: string
      description:
        example: Push-ups and a run every weekday morning
        maxLength: 2000
        type: string
      name:
        example: Morning workout
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListMomentsResponse:
    properties:
      moments:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse'
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginRequest:
    properties:
      email:
        example: budi@example.com
        type: string
      password:
        example: correct horse battery staple
        type: string
    required:
    - email
    - password
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginResponse:
    properties:
      access_token:
        description: |-
          AccessToken is meant to be held in memory on the frontend (not
          localStorage) and sent via the Authorization: Bearer header.
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        description: |-
          ExpiresIn is in seconds, so the frontend can schedule a silent
          refresh shortly before the access token actually expires.
        example: 900
        type: integer
      user:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UserResponse'
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentImageResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      url:
        example: https://storage.example.com/moments/.../abc123.jpg?X-Amz-...
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentResponse:
    properties:
      client_id:
        type: string
      color_hex:
        type: string
      created_at:
        example: "2026-08-04T14:35:00Z"
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      latitude:
        type: number
      longitude:
        type: number
      note:
        type: string
      occurred_at:
        description: |-
          OccurredAt is reconstructed from occurred_local +
          occurred_utc_offset_minutes, so it round-trips exactly the wall
          time and offset the Moment was captured with.
        example: "2026-08-04T14:30:00+09:00"
        type: string
      occurred_utc_offset_minutes:
        example: 540
        type: integer
      origin:
        example: manual
        type: string
      place_name:
        type: string
      recorded_at:
        example: "2026-08-04T14:35:00Z"
        type: string
      settling_time_seconds:
        example: 300
        type: integer
      thread_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      updated_at:
        example: "2026-08-04T14:35:00Z"
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 42
        type: integer
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.RegisterRequest:
    properties:
      email:
        example: budi@example.com
        maxLength: 255
        type: string
      name:
        example: Budi Santoso
        maxLength: 255
        minLength: 1
        type: string
      password:
        description: |-
          scrypt hashes the whole password with no truncation. max=256 is
          just a generous sane upper bound (prevents someone posting a
          multi-KB "password" that'd waste CPU/memory on the scrypt KDF
          for no real security benefit).
        example: correct horse battery staple
        maxLength: 256
        minLength: 8
        type: string
      username:
        description: |-
          Matches users.chk_users_username_format — lowercase letters,
          digits, underscore, and dot only. Stored as typed, matched
          case-insensitively for uniqueness. See the "username" custom
          validator registered in AuthHandler.
        example: budisantoso
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.SearchThreadsResponse:
    properties:
      pagination:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse'
      threads:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadImageResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      url:
        example: https://storage.example.com/threads/.../abc123.jpg?X-Amz-...
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadResponse:
    properties:
      archived_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      circle_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      color_hex:
        type: string
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      description:
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      name:
        example: Morning workout
        type: string
      sort_order:
        example: 0
        type: integer
      updated_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UpdateMomentRequest:
    properties:
      color_hex:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      note:
        maxLength: 10000
        type: string
      occurred_at:
        example: "2026-08-04T14:30:00+09:00"
        type: string
      occurred_utc_offset_minutes:
        example: 540
        maximum: 1020
        minimum: -1020
        type: integer
      place_name:
        maxLength: 255
        type: string
      thread_id:
        type: string
    required:
    - occurred_at
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UpdateThreadRequest:
    properties:
      color_hex:
        example: '#FF5733'
        type: string
      description:
        example: Push-ups and a run every weekday morning
        maxLength: 2000
        type: string
      name:
        example: Morning workout
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UserResponse:
    properties:
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      email:
        example: budi@example.com
        type: string
      email_verified:
        example: false
        type: boolean
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      name:
        example: Budi Santoso
        type: string
      username:
        example: budisantoso
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      errors: {}
      message:
        example: Success
        type: string
    type: object
  ? github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-array_github_com_ngodingvareng_memoria_internal_delivery_rest_dto_MomentImageResponse
