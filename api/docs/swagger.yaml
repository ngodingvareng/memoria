info:
  contact: {}
  title: Book API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Returns an access token in the response body and sets
        the refresh token as an httpOnly cookie scoped to /auth.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out of the current session
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Reads the refresh token from the httpOnly cookie, rotates
        it, and returns a new access token plus a new refresh
        cookie. Reusing an already-rotated refresh token revokes
        its entire token family and forces a fresh login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Exchange the refresh token cookie for a new access/refresh token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Register a new account
      tags:
      - auth
  /threads:
    get:
      description: Search and filter the authenticated user's threads, with pagination
      parameters:
      - description: Filter by name (partial, case-insensitive)
        in: query
        name: name
        type: string
      - description: Filter by whether the thread carries a commitment
        in: query
        name: has_commitment
        type: boolean
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Threads per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_SearchThreadsResponse'
      summary: Search / list threads
      tags:
      - threads
    post:
      consumes:
      - application/json
      description: Create a new thread for the authenticated user
      parameters:
      - description: Create thread request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateThreadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Create a new thread
      tags:
      - threads
  /threads/{id}:
    delete:
      description: Soft-deletes an thread owned by the authenticated user
      parameters:
      - description: Thread ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Delete an thread
      tags:
      - threads
    get:
      description: Get a single thread belonging to the authenticated user
      parameters:
      - description: Thread ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Get an thread by ID
      tags:
      - threads
    put:
      consumes:
      - application/json
      description: Full-representation update of an thread owned by the authenticated
        user
      parameters:
      - description: Thread ID
        in: path
        name: id
        required: true
        type: string
      - description: Update thread request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UpdateThreadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Update an thread
      tags:
      - threads
  /threads/{id}/images:
    get:
      parameters:
      - description: Thread ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-array_github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadImageResponse'
      summary: List images for an thread
      tags:
      - threads
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Thread ID
        in: path
        name: id
        required: true
        type: string
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-github_com_ngodingvareng_memoria_internal_delivery_rest_dto_ThreadImageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.WebResponse-any'
      summary: Upload an image for an thread
      tags:
      - threads
  /threads/{id}/images/{imageId}:
    delete:
      parameters:
      - description: Thread ID
        in: path
        name: id
        required: true
        type: string
      - description: Image ID
        in: path
        name: imageId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete an thread image
      tags:
      - threads
swagger: "2.0"
