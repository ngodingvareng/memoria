basePath: /api/v1
definitions:
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.AlbumImageResponse:
    properties:
      height:
        type: integer
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_alt:
        type: string
      is_shared:
        description: |-
          IsShared/SharedBy are always false/omitted on GET /album. On
          GET /circles/{id}/album, IsShared is true and SharedBy is set iff
          this image's Moment reached the Circle via the mention/share
          flow rather than one of the Circle's own collaborative Threads.
        type: boolean
      moment_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      occurred_at:
        example: "2026-08-04T14:30:00+09:00"
        type: string
      shared_by:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.AlbumSharedByResponse'
      thread_name:
        description: |-
          ThreadName is omitted when the image's Moment has no parent
          Thread.
        example: Morning Run
        type: string
      url:
        example: https://storage.example.com/moments/.../abc123.jpg?X-Amz-...
        type: string
      width:
        type: integer
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.AlbumSharedByResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      username:
        example: budisantoso
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.BlockUserRequest:
    properties:
      username:
        example: budisantoso
        type: string
    required:
    - username
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CheckUsernameAvailabilityResponse:
    properties:
      available:
        example: true
        type: boolean
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleInviteLinkResponse:
    properties:
      invite:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleInviteResponse'
      token:
        example: a1b2c3...
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleInviteResponse:
    properties:
      circle_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      expires_at:
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      invited_by_user_id:
        type: string
      invitee_user_id:
        type: string
      kind:
        example: username
        type: string
      requires_approval:
        type: boolean
      responded_at:
        type: string
      status:
        example: pending
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleJoinRequestResponse:
    properties:
      circle_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      decided_at:
        type: string
      decided_by_user_id:
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      invite_id:
        type: string
      status:
        example: pending
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleMemberResponse:
    properties:
      can_capture:
        type: boolean
      can_invite:
        type: boolean
      circle_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      joined_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      role:
        example: admin
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleResponse:
    properties:
      color_hex:
        type: string
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      created_by_user_id:
        type: string
      description:
        type: string
      dissolved_at:
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_path:
        type: string
      name:
        example: NgodingVareng
        type: string
      updated_at:
        example: "2026-07-20T10:00:00Z"
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CommentResponse:
    properties:
      body:
        example: Oh man, I remember this!
        type: string
      circle_id:
        type: string
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      moment_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      updated_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      user_id:
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateCircleRequest:
    properties:
      color_hex:
        type: string
      description:
        maxLength: 2000
        type: string
      image_path:
        maxLength: 1024
        type: string
      name:
        example: NgodingVareng
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateCommentRequest:
    properties:
      body:
        maxLength: 10000
        minLength: 1
        type: string
      circle_id:
        description: |-
          CircleID omitted means the mention context; set, it names which
          Circle audience the comment is posted in (FEATURES.md, Response).
        type: string
    required:
    - body
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateMentionRequest:
    properties:
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - username
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateMomentRequest:
    properties:
      client_id:
        description: |-
          ClientID lets an offline-captured Moment be synced twice (e.g. a
          flaky retry) without creating a duplicate.
        type: string
      color_hex:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      note:
        maxLength: 10000
        type: string
      occurred_at:
        example: "2026-08-04T14:30:00+09:00"
        type: string
      occurred_utc_offset_minutes:
        description: |-
          The local UTC offset in effect where it happened, in minutes.
          Omitted means UTC (0) — see the moments.occurred_utc_offset_minutes
          column comment for the ±1020 (±17h) bound.
        example: 540
        maximum: 1020
        minimum: -1020
        type: integer
      origin:
        description: |-
          Origin defaults to "manual" server-side when omitted. "commitment"
          is deliberately not accepted here — Commitment-generated Moments
          never go through this path (FEATURES.md).
        enum:
        - manual
        - import
        type: string
      place_name:
        maxLength: 255
        type: string
      recorded_at:
        description: |-
          RecordedAt is for offline sync only: the true local time the user
          actually wrote the Moment down. Omitted means "now" (ordinary
          online capture) — see FEATURES.md's Time table.
        type: string
      thread_id:
        type: string
    required:
    - occurred_at
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateOrRotateInviteLinkRequest:
    properties:
      requires_approval:
        type: boolean
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CreateThreadRequest:
    properties:
      circle_id:
        description: |-
          CircleID creates a collaborative Thread owned by that Circle
          instead of a personal one; the caller must be an active member.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      color_hex:
        example: '#FF5733'
        type: string
      description:
        example: Push-ups and a run every weekday morning
        maxLength: 2000
        type: string
      name:
        example: Morning workout
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.FollowInviteLinkRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.FollowInviteLinkResponse:
    properties:
      join_request:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleJoinRequestResponse'
      member:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleMemberResponse'
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ForgotPasswordRequest:
    properties:
      email:
        example: budi@example.com
        maxLength: 255
        type: string
    required:
    - email
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.GoogleLoginRequest:
    properties:
      id_token:
        example: eyJhbGciOiJSUzI1NiIs...
        type: string
    required:
    - id_token
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.InviteDirectRequest:
    properties:
      usernames:
        items:
          type: string
        maxItems: 50
        minItems: 1
        type: array
    required:
    - usernames
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.InviteDirectResponse:
    properties:
      added_members:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleMemberResponse'
        type: array
      pending_invites:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleInviteResponse'
        type: array
      skipped_usernames:
        items:
          type: string
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListAlbumResponse:
    properties:
      images:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.AlbumImageResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse'
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListBlockedUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PublicUserResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListCircleInvitesResponse:
    properties:
      invites:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleInviteResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListCircleJoinRequestsResponse:
    properties:
      join_requests:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleJoinRequestResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListCircleMembersResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleMemberResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListCirclesResponse:
    properties:
      circles:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CircleResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListCommentsResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.CommentResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListMentionsResponse:
    properties:
      mentions:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MentionResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListMomentSharesResponse:
    properties:
      circle_ids:
        items:
          type: string
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListMomentsResponse:
    properties:
      moments:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse'
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListMutedUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PublicUserResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListNotificationsResponse:
    properties:
      notifications:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.NotificationResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse'
      unread_count:
        example: 3
        type: integer
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListReactionsResponse:
    properties:
      reactions:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ReactionResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ListThreadsResponse:
    properties:
      threads:
        items:
          $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ThreadResponse'
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginRequest:
    properties:
      email:
        example: budi@example.com
        type: string
      password:
        example: correct horse battery staple
        type: string
    required:
    - email
    - password
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.LoginResponse:
    properties:
      access_token:
        description: |-
          AccessToken is meant to be held in memory on the frontend (not
          localStorage) and sent via the Authorization: Bearer header.
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        description: |-
          ExpiresIn is in seconds, so the frontend can schedule a silent
          refresh shortly before the access token actually expires.
        example: 900
        type: integer
      user:
        $ref: '#/definitions/github_com_ngodingvareng_memoria_internal_delivery_rest_dto.UserResponse'
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MentionResponse:
    properties:
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      display_name:
        example: Gede
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      mentioned_user_id:
        type: string
      moment_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      shared_circle_ids:
        description: |-
          SharedCircleIDs is only populated by CreateMention — which
          Circles the owner and the mentioned user both actively belong to,
          the candidate set for "Share to circle too?" (FEATURES.md,
          Mention). Always empty on ListMentions.
        items:
          type: string
        type: array
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentAudienceResponse:
    properties:
      circle_ids:
        items:
          type: string
        type: array
      mention_allowed:
        type: boolean
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentCircleResponse:
    properties:
      circle_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      moment_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      shared_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      shared_by_user_id:
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentImageResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      url:
        example: https://storage.example.com/moments/.../abc123.jpg?X-Amz-...
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentResponse:
    properties:
      client_id:
        type: string
      color_hex:
        type: string
      created_at:
        example: "2026-08-04T14:35:00Z"
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      latitude:
        type: number
      longitude:
        type: number
      note:
        type: string
      occurred_at:
        description: |-
          OccurredAt is reconstructed from occurred_local +
          occurred_utc_offset_minutes, so it round-trips exactly the wall
          time and offset the Moment was captured with.
        example: "2026-08-04T14:30:00+09:00"
        type: string
      occurred_utc_offset_minutes:
        example: 540
        type: integer
      origin:
        example: manual
        type: string
      place_name:
        type: string
      recorded_at:
        example: "2026-08-04T14:35:00Z"
        type: string
      settling_time_seconds:
        example: 300
        type: integer
      thread_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      updated_at:
        example: "2026-08-04T14:35:00Z"
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MomentSuggestionResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      note:
        type: string
      occurred_at:
        example: "2026-08-04T14:30:00+09:00"
        type: string
      place_name:
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.MuteUserRequest:
    properties:
      username:
        example: budisantoso
        type: string
    required:
    - username
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.NotificationPreferencesResponse:
    properties:
      added_to_circle_enabled:
        type: boolean
      circle_invite_received_enabled:
        type: boolean
      circle_join_request_approved_enabled:
        type: boolean
      circle_join_request_received_enabled:
        type: boolean
      commitment_upcoming_enabled:
        type: boolean
      echo_ready_enabled:
        type: boolean
      mentioned_in_moment_enabled:
        type: boolean
      moment_due_enabled:
        type: boolean
      moment_missed_enabled:
        type: boolean
      quiet_hours_end:
        example: "07:00:00"
        type: string
      quiet_hours_start:
        description: |-
          QuietHoursStart/End are "HH:MM:SS" wall-clock strings, both set or
          both nil — may wrap past midnight (e.g. 22:00:00 -> 07:00:00).
        example: "22:00:00"
        type: string
      recap_generated_enabled:
        type: boolean
      response_digest_enabled:
        type: boolean
      response_digest_hour:
        example: 20
        type: integer
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.NotificationResponse:
    properties:
      actor_user_id:
        type: string
      circle_id:
        type: string
      circle_invite_id:
        type: string
      circle_join_request_id:
        type: string
      commitment_id:
        type: string
      commitment_occurrence_id:
        type: string
      created_at:
        example: "2026-08-04T14:35:00Z"
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      kind:
        example: mentioned_in_moment
        type: string
      moment_id:
        type: string
      payload:
        example: '{}'
        type: string
      read_at:
        type: string
      recap_id:
        type: string
      resurfacing_id:
        type: string
      thread_id:
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PaginationResponse:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 42
        type: integer
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PrivateUserResponse:
    properties:
      bio:
        type: string
      circle_invite_policy:
        example: known
        type: string
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      discoverable_by_username:
        example: true
        type: boolean
      email:
        example: budi@example.com
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_path:
        type: string
      mention_policy:
        example: anyone
        type: string
      name:
        example: Budi Santoso
        type: string
      strip_photo_metadata:
        example: false
        type: boolean
      username:
        example: budisantoso
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.PublicUserResponse:
    properties:
      bio:
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_path:
        type: string
      name:
        example: Budi Santoso
        type: string
      username:
        description: Username is nil until the user has claimed one.
        example: budisantoso
        type: string
    type: object
  github_com_ngodingvareng_memoria_internal_delivery_rest_dto.ReactionResponse:
    properties:
      circle_id:
        type: string
      created_at:
        example: "2026-07-20T10:00:00Z"
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      kind:
