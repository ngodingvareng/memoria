name: Web test

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "api/docs/swagger.json"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - "api/docs/swagger.json"

jobs:
  format-and-lint:
    name: Check Format and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: bun run format:check

      - name: Check Linting
        run: bun run lint

  check-api-drift:
    name: Check API Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate API types/hooks and fail on drift
        run: |
          bun run generate:api
          git diff --exit-code -- src/lib/api/generated

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
